# environment.yml -- software used for Code/05_Revision, pinned to the versions actually used for the
# manuscript revision (October 2026; macOS arm64). Create with:
#   conda env create -f Code/05_Revision/environment.yml && conda activate dcr-revision
# Exact pins are recorded for provenance; nearby versions should work. Note pandas 3.x (string dtype).
name: dcr-revision
channels:
  - conda-forge
  - bioconda
dependencies:
  # --- Python (analysis steps) -------------------------------------------------------------------
  - python=3.11.15
  - numpy=2.4.6
  - pandas=3.0.3
  - scipy=1.17.1
  - statsmodels=0.14.6
  - pybigwig=0.3.25          # splice-site phyloP, A2 conservation
  - pyfaidx=0.9.0.4          # A2 sequences
  - pybedtools=0.12.1        # A2 NMD rerun (verbatim pipeline function)
  - matplotlib=3.11.0        # only used by the archived prior-session cells
  - pyliftover=0.4.1         # only used by the archived prior-session cells
  # --- command-line tools -----------------------------------------------------------------------
  - bedtools=2.31.1
  - samtools=1.22.1
  - ghostscript              # optional: font embedding in the PDFs (10.05.1 used)
  # UCSC liftOver (kent tools; used only by the archived X/X' and selection-input cells):
  #   conda install -c bioconda ucsc-liftover   (the revision used a standalone binary)
  # --- R (figures) --------------------------------------------------------------------------------
  # The figures were rendered with a system R 4.3.1 (Homebrew/CRAN binaries), package versions:
  #   ggplot2 3.5.2, cowplot 1.1.3, data.table 1.14.10, dplyr 1.1.4, tidyr 1.3.0, scales 1.3.0,
  #   ragg 1.2.7 (systemfonts 1.0.5, textshaping 0.3.7)
  # Conda equivalents (uncomment to install R in the same env):
  # - r-base=4.3.1
  # - r-ggplot2=3.5.2
  # - r-cowplot=1.1.3
  # - r-data.table=1.14.10
  # - r-dplyr=1.1.4
  # - r-tidyr=1.3.0
  # - r-scales=1.3.0
  # - r-ragg=1.2.7
